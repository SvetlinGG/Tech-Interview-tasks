<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="taskList">
        <li>Learn DOM <button class="delete">Delete</button></li>
        <li>Practice JS <button class="delete">Delete</button></li>
        <li>Build Project <button class="delete">Delete</button></li>
    </ul>

    <script>
        const ulElement = document.getElementById('taskList');

        ulElement.addEventListener('click', onClick);

        function onClick(e){
            const liElement = document.querySelectorAll('li');

            if (e.target.classList.contains('delete')){
                liElement.remove(e.target);
            }else {
                return
            }
            
            // liElement.forEach( el => {
                  
            //         ulElement.remove(el.textContent)
            
            // })
        }
    </script>
</body>
</html>
