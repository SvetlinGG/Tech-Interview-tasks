<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="cart">
    <li data-price="100" data-quantity="2">Product A</li>
    <li data-price="50" data-quantity="3">Product B</li>
    <li data-price="20" data-quantity="1">Product C</li>
</ul>

<p id="total"></p>

<button id="calculate">Calculate</button>

<script>
    const liElements = document.querySelectorAll('#cart li');
    const button = document.getElementById('calculate');
    const total = document.getElementById('total');
   
    
    
    button.addEventListener('click', onClick);

    function onClick(){
        let totalPrice = 0;
        liElements.forEach(item => {

            totalPrice += Number(item.dataset.price) * Number(item.dataset.quantity);

        });
        total.textContent ='Total: ' + totalPrice
    }
    


</script>
</body>
</html>
