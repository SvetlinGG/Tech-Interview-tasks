<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Manager</title>
</head>
<body>
    <form id="userForm">
        <input id="nameInput" type="text" placeholder="Name">
        <button type="submit">Add user</button>
    </form>

    <ul id="userList"></ul>

    <p id="activeCount">Active: 0</p>

    <script>

        const users = [
        { id: 1, name: "Anna", active: true },
        { id: 2, name: "John", active: false }
        ];

        const userForm = document.getElementById('userForm');
        const userList = document.getElementById('userList');
        const activeCount = document.getElementById('activeCount');
        const newUser = document.getElementById('nameInput');

        function updateActiveCount(){
            const count = users.filter(u => u.active).length;
            activeCount.textContent = `Active: ${count}`;
        }

        function createLi(user){
            const liElement = document.createElement('li');
            liElement.dataset.id = user.id;
            liElement.textContent = `${user.name} `;

            const createBtnAct = document.createElement('button');
            createBtnAct.textContent = user.active ? 'Deactivate' : 'Activate';
            createBtnAct.dataset.action = 'toggle';

            const createBtnDelete = document.createElement('button');
            createBtnDelete.textContent = 'Delete';
            createBtnDelete.dataset.action = 'delete';

            liElement.appendChild(createBtnAct);
            liElement.appendChild(createBtnDelete);
            userList.appendChild(liElement);
        }

        for (let user of users){
            createLi(user);
        }
        updateActiveCount();

        userList.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') return;

            const li = e.target.closest('li');
            const id = Number(li.dataset.id);
            const user = users.find(u => u.id === id);

            if (e.target.dataset.action === 'toggle'){
                user.active = !user.active;
                e.target.textContent = user.active ? 'Deactivate' : 'Activate';
                updateActiveCount();
            }

            if (e.target.dataset.action === 'delete'){
                users.splice(users.indexOf(user), 1);
                li.remove();
                updateActiveCount();
            }
        });

        userForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (newUser.value.trim() === '') return;

            const newUserObj = {
                id: Date.now(),
                name: newUser.value.trim(),
                active: false
            };

            users.push(newUserObj);
            createLi(newUserObj);
            updateActiveCount();
            newUser.value = '';
        });


    </script>
</body>
</html>
