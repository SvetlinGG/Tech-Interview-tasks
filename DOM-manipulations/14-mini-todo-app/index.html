<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .completed {
            text-decoration: line-through;
        }
    </style>
    

    <input id="taskInput" type="text" placeholder="New task">
    <button id="addTask">Add</button>

    <p id="taskCount">Tasks: 0</p>

    <ul id="taskList"></ul>

    <script>
        const input = document.getElementById('taskInput');
        const btn = document.getElementById('addTask');
        const ulElement = document.getElementById('taskList')
        const counter = document.getElementById('taskCount');

        btn.addEventListener('click', onClick);

        function onClick(e){

            const cresteLiElement = document.createElement('li');
            if (input.value = 'Learn DOM'){
                ulElement.appendChild(cresteLiElement);
                cresteLiElement.textContent = `
                <li>
                    <span>Learn DOM</span>
                    <button class="complete">Complete</button>
                    <button class="delete">Delete</button>
                </li>
                `
            }

        }


    </script>
</body>
</html>
