<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .completed {
            text-decoration: line-through;
        }
    </style>
    

    <input id="taskInput" type="text" placeholder="New task">
    <button id="addTask">Add</button>

    <p id="taskCount">Tasks: 0</p>

    <ul id="taskList"></ul>

    <script>
        const input = document.getElementById('taskInput');
        const btn = document.getElementById('addTask');
        const ulElement = document.getElementById('taskList')

        const counter = document.getElementById('taskCount');


        ulElement.addEventListener('click', onPush);
        btn.addEventListener('click', onClick);

        function onClick(e){

            const createLiElement = document.createElement('li');
            const value = input.value.trim();
            if(!value) return;

            const createSpanElement = document.createElement('span');
            const createBtnComplete = document.createElement('button');
            createBtnComplete.textContent = 'Complete';

            const createBtnDelete = document.createElement('button');
            createBtnDelete.textContent = 'Delete';

            createSpanElement.textContent = value;

            createBtnComplete.classList.add('complete');

            createBtnDelete.classList.add('delete');

            createLiElement.appendChild(createSpanElement);
            createLiElement.appendChild(createBtnComplete);
            createLiElement.appendChild(createBtnDelete);

            ulElement.appendChild(createLiElement);
            updateCounter()
            input.value = '';

            

        }

        function onPush(e){
                if (e.target.classList.contains('complete')){
                e.target.parentElement.classList.toggle('completed')
                }

                if (e.target.classList.contains('delete')){
                e.target.parentElement.remove();
                }else {
                    return
            }
        }

        function updateCounter(){

            counter.value = Number(counter.textContent);
            counter.textContent = "Tasks: " + ulElement;
        }


    </script>
</body>
</html>
