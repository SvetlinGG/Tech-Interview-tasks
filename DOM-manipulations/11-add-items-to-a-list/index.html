<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="taskInput" type="text" placeholder="New task">
    <button id="addTask">Add</button>

    <ul id="taskList"></ul>

    <script>
        const inputArea = document.getElementById('taskInput');
        const btn = document.getElementById('addTask');
        const ulElement = document.getElementById('taskList');


        btn.addEventListener('click', onClick);

        function onClick(){
            
            const value = inputArea.value.trim();
            if(!value) return;
                
            
            const createLiElement = document.createElement('li');

            createLiElement.textContent = inputArea.value;
            ulElement.append(createLiElement);
            inputArea.value = '';
        }
    </script>
</body>
</html>
