<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>
<body>
    
    <form id="userForm">
        <input id="nameInput" type="text" placeholder="Name">
        <input id="ageInput" type="number" placeholder="Age">
        <button type="submit">Add User</button>
    </form>

    <p id="error"></p>

    <ul id="userList"></ul>

    <script>
        const userForm = document.getElementById('userForm');
        const userList = document.getElementById('userList');

        const name = document.getElementById('nameInput');
        const age = document.getElementById('ageInput');


        const error = document.getElementById('error');
        

        userForm.addEventListener('submit', onSubmit);

        name.addEventListener('input', () => error.textContent = '');
        age.addEventListener('input', () => error.textContent = '');

        function onSubmit(e){
            e.preventDefault();

            if (name.value.trim() === '' || age.value < 18){
                error.textContent = 'Invalid user';
                return;
            }

            const createLiElement = document.createElement('li');
            createLiElement.textContent = `${name.value} - ${age.value}`;
            userList.appendChild(createLiElement);

            name.value = '';
            age.value = '';
        }




    </script>
</body>
</html>
