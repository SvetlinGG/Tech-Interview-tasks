<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List + Event Delegation + State</title>
</head>
<body>
    <ul id="productList">
            
        
    </ul>

    <p id="cartCount">Cart: 0</p>

    <script>
        const products = [
    { id: 1, name: "Laptop", price: 1200, inCart: false },
    { id: 2, name: "Mouse", price: 40, inCart: false },
    { id: 3, name: "Monitor", price: 300, inCart: false }
];

        const productList = document.getElementById('productList');
        const counter = document.getElementById('cartCount');
        

        for ( let product of products){
                const liElement = document.createElement('li');
                liElement.textContent = `${product.name} - $${product.price}`;
                const createBtn = document.createElement('button');
                createBtn.textContent = 'Add to cart';
                createBtn.dataset.id = product.id;
                liElement.appendChild(createBtn);
                productList.appendChild(liElement)
            }

        productList.addEventListener('click', onClick);

        let cartCount = 0;

        function onClick(e){
            if (e.target.tagName !== 'BUTTON') return;

            const id = Number(e.target.dataset.id);
            const product = products.find(p => p.id === id);

            if (product.inCart) return;

            product.inCart = true;
            e.target.textContent = 'Added';
            cartCount++;
            counter.textContent = `Cart: ${cartCount}`;
        }



    </script>
</body>
</html>
