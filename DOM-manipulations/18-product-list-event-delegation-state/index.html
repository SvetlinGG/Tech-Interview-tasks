<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List + Event Delegation + State</title>
</head>
<body>
    <ul id="productList">
         <button data-id="1">Add to cart</button>   
        
    </ul>

    <p id="cartCount">Cart: 0</p>

    <script>
        const products = [
    { id: 1, name: "Laptop", price: 1200, inCart: false },
    { id: 2, name: "Mouse", price: 40, inCart: false },
    { id: 3, name: "Monitor", price: 300, inCart: false }
];

        const productList = document.getElementById('productList');
        const counter = document.getElementById('cartCount');
        const btn = document.getElementsByTagName('button')

        productList.addEventListener('click', onClick);

        function onClick(e){
            
            const liElement = document.createElement('li');
            productList.appendChild(liElement);
            


            for ( let product of products){
                liElement.textContent = `${product.name} - $${product.price}  `+ btn
                counter.textContent = 'Cart: ' + product.id
            }
        }



    </script>
</body>
</html>
